services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart-pot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_pot
      POSTGRES_USER: smart_pot_user
      POSTGRES_PASSWORD: smart_pot_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: